# Configuration for the open pantum backend (Pantum M6500/M6507 series).
#
# One "usb VENDOR PRODUCT [model]" line per supported device id.  Only the
# M6500-series id has been tested on real hardware; the other ids share the
# same "ASP" protocol in the vendor driver and are listed as candidates.

usb 0x232b 0x0e20 M6500 series
usb 0x232b 0x1e20 M6500N
usb 0x232b 0x7e20 M6500W
usb 0x232b 0x2e20 M6500NW
usb 0x232b 0x086d M6507N
